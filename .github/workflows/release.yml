name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - name: Package app
        run: |
          cd release/SolarSpace-darwin-arm64
          ditto -c -k --sequesterRsrc --keepParent SolarSpace.app "$RUNNER_TEMP/SolarSpace-macOS-arm64.zip"
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "SOLARSPACE $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SolarSpace-macOS-arm64.zip" --clobber
      - name: Publish rolling main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BODY=$(printf '自动构建自主分支 `main` 的最新提交。\n\n- 提交：`%s`\n- 构建时间：%s\n- 运行记录：%s/%s/actions/runs/%s\n\n这是未签名的预发布构建，macOS 首次打开请右键 → 打开。' \
            "$SHA_SHORT" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build (main)"
          gh release edit latest --prerelease --title "Latest build (main)" --notes "$BODY" --target "$GITHUB_SHA"
          gh release upload latest "$RUNNER_TEMP/SolarSpace-macOS-arm64.zip" --clobber
